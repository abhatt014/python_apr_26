{% extends 'base.html' %} 
{% block content %}
<body class="auth-body">
  <button class="icon-button theme-toggle auth-theme-toggle" type="button" data-theme-toggle aria-label="Switch color theme" title="Switch color theme">
    <i class="bi bi-moon-stars" data-theme-icon aria-hidden="true"></i>
  </button>
  <main class="auth-page">
    <section class="auth-card">
      <a class="auth-brand" href="index.html"><span class="brand-icon"><i class="bi bi-grid-1x2-fill" aria-hidden="true"></i></span><span><strong>E-Commerce App</strong></span></a>
      
      <form class="needs-validation" novalidate method="post" action="/register">
        <div class="mb-4">
          <h1 class="h3 mb-1">Register</h1>
          <p class="text-muted mb-0">Create your account.</p>
        </div>
        <div class="mb-3"><label class="form-label" for="registerName">Full name</label><input class="form-control" id="registerName" type="text" name="name" required><div class="invalid-feedback">Full name is required.</div></div>
        <div class="mb-3"><label class="form-label" for="registerEmail">Email address</label><input class="form-control" id="registerEmail" type="email" name="email" required><div class="invalid-feedback">Enter a valid email.</div></div>
        <div class="mb-3"><label class="form-label" for="registerPassword">Password</label><input class="form-control" id="registerPassword" type="password"  name="password" required><div class="invalid-feedback">Password must be at least 6 characters.</div></div>
        <div class="form-check mb-4"><input class="form-check-input" type="checkbox" id="terms" required><label class="form-check-label" for="terms">I agree to the terms</label><div class="invalid-feedback">You must agree before continuing.</div></div>
        <button class="btn btn-primary w-100" type="submit"><i class="bi bi-person-plus" aria-hidden="true"></i> Create Account</button>
      </form>
      
      <div class="auth-footer">Already have an account? <a href="/login">Sign in</a></div>
    </section>
    </main>
{% endblock %}
