<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The toolbox — deploy.sh</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700;800&family=Inter:wght@400;500;600;700&display=swap');

  :root{
    --bg: #0d1117;
    --bg-raised: #12181f;
    --surface: #161d26;
    --border: #232b35;
    --text: #e6edf3;
    --text-dim: #8b95a1;
    --text-faint: #545d68;
    --amber: #ffb454;
    --amber-dim: #b8823c;
    --green: #3fb950;
    --red: #f85149;
    --blue: #58a6ff;
    --purple: #bc8cff;
    --mono: 'JetBrains Mono', monospace;
    --sans: 'Inter', sans-serif;
  }

  *{ margin:0; padding:0; box-sizing:border-box; }
  html{ scroll-behavior:smooth; }
  body{
    background:var(--bg); color:var(--text); font-family:var(--sans); line-height:1.6;
  }
  a{ color:inherit; text-decoration:none; }
  ::selection{ background:var(--amber); color:#0d1117; }

  body::before{
    content:""; position:fixed; inset:0;
    background:repeating-linear-gradient(to bottom, rgba(255,255,255,0.012) 0px, rgba(255,255,255,0.012) 1px, transparent 1px, transparent 3px);
    pointer-events:none; z-index:9999;
  }

  .wrap{ max-width:1120px; margin:0 auto; padding:0 32px; }

  /* NAV — same as index */
  nav{ position:sticky; top:0; z-index:100; background:rgba(13,17,23,0.85); backdrop-filter:blur(10px); border-bottom:1px solid var(--border); }
  nav .wrap{ height:64px; display:flex; align-items:center; justify-content:space-between; }
  .logo{ font-family:var(--mono); font-weight:700; font-size:15px; display:flex; align-items:center; gap:8px; letter-spacing:-0.02em; }
  .logo .caret{ color:var(--amber); animation:blink 1.1s step-end infinite; }
  @keyframes blink{ 50%{ opacity:0; } }
  .nav-links{ display:flex; align-items:center; gap:36px; }
  .nav-links a{ font-family:var(--mono); font-size:13px; color:var(--text-dim); position:relative; padding:4px 0; transition:color .15s; }
  .nav-links a:hover{ color:var(--text); }
  .nav-links a.active{ color:var(--amber); }
  .nav-links a.active::after{ content:""; position:absolute; left:0; right:0; bottom:-2px; height:2px; background:var(--amber); }
  .status-pill{ display:flex; align-items:center; gap:7px; font-family:var(--mono); font-size:12px; color:var(--text-dim); border:1px solid var(--border); padding:6px 12px; border-radius:20px; }
  .dot{ width:7px; height:7px; border-radius:50%; background:var(--green); box-shadow:0 0 8px var(--green); }
  .menu-btn{ display:none; background:none; border:none; color:var(--text); font-size:22px; cursor:pointer; }

  /* HEADER */
  .page-head{ padding:64px 0 40px; border-bottom:1px solid var(--border); }
  .eyebrow{ font-family:var(--mono); font-size:12px; color:var(--amber); text-transform:uppercase; letter-spacing:0.14em; margin-bottom:16px; display:flex; align-items:center; gap:10px; }
  .eyebrow::before{ content:"//"; color:var(--text-faint); }
  .page-head h1{ font-family:var(--mono); font-weight:800; font-size:36px; letter-spacing:-0.02em; margin-bottom:14px; }
  .page-head p{ color:var(--text-dim); font-size:16px; max-width:560px; }

  /* CONTROLS */
  .controls{
    position:sticky; top:64px; z-index:90;
    background:rgba(13,17,23,0.92); backdrop-filter:blur(10px);
    border-bottom:1px solid var(--border); padding:20px 0;
  }
  .controls-inner{ display:flex; gap:14px; flex-wrap:wrap; align-items:center; justify-content:space-between; }
  .search-box{
    position:relative; flex:1; min-width:220px; max-width:340px;
  }
  .search-box input{
    width:100%; background:var(--surface); border:1px solid var(--border); border-radius:7px;
    padding:10px 14px 10px 34px; color:var(--text); font-family:var(--mono); font-size:13px;
    outline:none; transition:border-color .15s;
  }
  .search-box input:focus{ border-color:var(--amber-dim); }
  .search-box input::placeholder{ color:var(--text-faint); }
  .search-box .icon{ position:absolute; left:12px; top:50%; transform:translateY(-50%); color:var(--text-faint); font-size:13px; }

  .filter-row{ display:flex; gap:8px; flex-wrap:wrap; }
  .filter-btn{
    font-family:var(--mono); font-size:12px; padding:8px 14px; border-radius:20px;
    background:var(--surface); border:1px solid var(--border); color:var(--text-dim);
    cursor:pointer; transition:all .15s; white-space:nowrap;
  }
  .filter-btn:hover{ border-color:var(--amber-dim); color:var(--text); }
  .filter-btn.active{ background:var(--amber); color:#1a1305; border-color:var(--amber); font-weight:600; }

  .result-count{ font-family:var(--mono); font-size:12px; color:var(--text-faint); padding:16px 0 0; }

  /* GRID */
  .tools-section{ padding:32px 0 90px; }
  .tools-grid{
    display:grid; grid-template-columns:repeat(3, 1fr); gap:16px; margin-top:20px;
  }
  .tool-card{
    background:var(--surface); border:1px solid var(--border); border-radius:10px;
    padding:22px; transition:border-color .2s, transform .2s;
    display:flex; flex-direction:column; gap:12px;
  }
  .tool-card:hover{ border-color:var(--amber-dim); transform:translateY(-2px); }
  .tool-top{ display:flex; align-items:flex-start; justify-content:space-between; gap:10px; }
  .tool-name{ font-size:16.5px; font-weight:700; }
  .tool-tag{
    font-family:var(--mono); font-size:10px; text-transform:uppercase; letter-spacing:0.06em;
    padding:4px 9px; border-radius:20px; white-space:nowrap; flex-shrink:0;
  }
  .tool-desc{ font-size:13.5px; color:var(--text-dim); flex:1; }
  .tool-cmd{
    font-family:var(--mono); font-size:11.5px; color:var(--text-faint);
    background:var(--bg-raised); border:1px solid var(--border); border-radius:6px;
    padding:8px 10px; overflow-x:auto; white-space:nowrap;
  }
  .tool-cmd .p{ color:var(--blue); }

  .tag-cicd{ background:rgba(255,180,84,0.12); color:var(--amber); }
  .tag-container{ background:rgba(88,166,255,0.12); color:var(--blue); }
  .tag-iac{ background:rgba(63,185,80,0.12); color:var(--green); }
  .tag-monitor{ background:rgba(188,140,255,0.12); color:var(--purple); }
  .tag-vcs{ background:rgba(248,81,73,0.12); color:var(--red); }

  .no-results{
    display:none; text-align:center; padding:60px 20px; color:var(--text-faint);
    font-family:var(--mono); font-size:14px;
  }
  .no-results.show{ display:block; }

  footer{ border-top:1px solid var(--border); padding:32px 0; display:flex; justify-content:space-between; align-items:center; font-family:var(--mono); font-size:12px; color:var(--text-faint); }
  footer a{ color:var(--text-dim); margin-left:20px; }
  footer a:hover{ color:var(--amber); }

  @media (max-width:860px){
    .nav-links{ position:fixed; top:64px; left:0; right:0; background:var(--bg-raised); flex-direction:column; align-items:flex-start; padding:20px 24px; gap:18px; border-bottom:1px solid var(--border); display:none; }
    .nav-links.open{ display:flex; }
    .menu-btn{ display:block; }
    .status-pill{ display:none; }
    .tools-grid{ grid-template-columns:1fr; }
    .controls{ top:64px; }
    .controls-inner{ flex-direction:column; align-items:stretch; }
    .search-box{ max-width:none; }
    footer{ flex-direction:column; gap:14px; text-align:center; }
    footer a{ margin:0 8px; }
  }
</style>
</head>
<body>

<nav>
  <div class="wrap">
    <div class="logo">devops<span class="caret">_</span></div>
    <div class="nav-links" id="navLinks">
      <a href="/">home</a>
      <a href="/tools" class="active">tools</a>
    </div>
    <div style="display:flex; align-items:center; gap:16px;">
      <div class="status-pill"><span class="dot"></span> all systems operational</div>
      <button class="menu-btn" id="menuBtn">☰</button>
    </div>
  </div>
</nav>

<header class="page-head">
  <div class="wrap">
    <div class="eyebrow">The toolbox</div>
    <h1>Every tool, sorted by what it does</h1>
    <p>No hype, no rankings — just what each one is actually for. Search by name or filter by stage.</p>
  </div>
</header>

<div class="controls">
  <div class="wrap controls-inner">
    <div class="search-box">
      <span class="icon">⌕</span>
      <input type="text" id="searchInput" placeholder="Search tools…" autocomplete="off">
    </div>
    <div class="filter-row" id="filterRow">
      <button class="filter-btn active" data-filter="all">All</button>
      <button class="filter-btn" data-filter="cicd">CI/CD</button>
      <button class="filter-btn" data-filter="container">Containers</button>
      <button class="filter-btn" data-filter="iac">IaC</button>
      <button class="filter-btn" data-filter="monitor">Monitoring</button>
      <button class="filter-btn" data-filter="vcs">Version Control</button>
    </div>
  </div>
</div>

<section class="tools-section">
  <div class="wrap">
    <div class="result-count" id="resultCount"></div>
    <div class="tools-grid" id="toolsGrid"></div>
    <div class="no-results" id="noResults">$ no matches found — try a different search</div>
  </div>
</section>

<footer>
  <div class="wrap" style="display:flex; justify-content:space-between; align-items:center; width:100%;">
    <span>devops_ — a field guide</span>
    <div>
      <a href="index.html">home</a>
      <a href="tools.html">tools</a>
    </div>
  </div>
</footer>

<script>
  document.getElementById('menuBtn').addEventListener('click', function(){
    document.getElementById('navLinks').classList.toggle('open');
  });

  const TOOLS = [
    { name:'Jenkins', cat:'cicd', tag:'CI/CD', desc:'The old guard of automation servers — self-hosted, plugin-driven, and endlessly configurable.', cmd:'$ jenkins-cli build my-pipeline' },
    { name:'GitHub Actions', cat:'cicd', tag:'CI/CD', desc:'Pipelines defined as YAML, living right next to the code they build and test.', cmd:'$ gh workflow run deploy.yml' },
    { name:'GitLab CI', cat:'cicd', tag:'CI/CD', desc:'Built into GitLab itself — one place for code, pipelines, and deployment tracking.', cmd:'$ gitlab-runner exec docker test' },
    { name:'CircleCI', cat:'cicd', tag:'CI/CD', desc:'Cloud-native pipelines with fast parallelism and tight Docker integration.', cmd:'$ circleci local execute' },
    { name:'ArgoCD', cat:'cicd', tag:'CI/CD', desc:'GitOps for Kubernetes — the cluster continuously syncs to match what\'s in Git.', cmd:'$ argocd app sync production' },
    { name:'Docker', cat:'container', tag:'Containers', desc:'Packages an app and everything it needs into one portable image.', cmd:'$ docker build -t app:latest .' },
    { name:'Kubernetes', cat:'container', tag:'Containers', desc:'Orchestrates containers across a cluster — scheduling, scaling, and healing them.', cmd:'$ kubectl apply -f deploy.yaml' },
    { name:'Podman', cat:'container', tag:'Containers', desc:'A daemonless alternative to Docker that runs containers without root.', cmd:'$ podman run -d nginx' },
    { name:'Helm', cat:'container', tag:'Containers', desc:'Packages Kubernetes manifests into versioned, reusable charts.', cmd:'$ helm install app ./chart' },
    { name:'Terraform', cat:'iac', tag:'IaC', desc:'Declares cloud infrastructure as code, then plans and applies the diff.', cmd:'$ terraform apply -auto-approve' },
    { name:'Ansible', cat:'iac', tag:'IaC', desc:'Agentless configuration management — push YAML playbooks over SSH.', cmd:'$ ansible-playbook site.yml' },
    { name:'Pulumi', cat:'iac', tag:'IaC', desc:'Infrastructure as code written in real programming languages, not just YAML.', cmd:'$ pulumi up' },
    { name:'Chef', cat:'iac', tag:'IaC', desc:'Configuration as Ruby-based "recipes," converging servers to a defined state.', cmd:'$ chef-client --local-mode' },
    { name:'Prometheus', cat:'monitor', tag:'Monitoring', desc:'Pulls and stores time-series metrics, then lets you alert on any threshold.', cmd:'$ promtool query instant up' },
    { name:'Grafana', cat:'monitor', tag:'Monitoring', desc:'Turns metrics from anywhere into dashboards people actually look at.', cmd:'$ grafana-cli plugins install' },
    { name:'Datadog', cat:'monitor', tag:'Monitoring', desc:'Unified metrics, logs, and traces with alerting built in from day one.', cmd:'$ datadog-agent status' },
    { name:'ELK Stack', cat:'monitor', tag:'Monitoring', desc:'Elasticsearch, Logstash, and Kibana — search and visualize logs at scale.', cmd:'$ curl localhost:9200/_cat/indices' },
    { name:'PagerDuty', cat:'monitor', tag:'Monitoring', desc:'Routes alerts to the right human, on-call schedule and all.', cmd:'$ pd incident trigger' },
    { name:'Git', cat:'vcs', tag:'Version Control', desc:'The distributed version control system everything else in this list assumes you have.', cmd:'$ git commit -m "fix: retry logic"' },
    { name:'GitHub', cat:'vcs', tag:'Version Control', desc:'Hosts repositories and wraps them in pull requests, issues, and actions.', cmd:'$ gh pr create --fill' },
    { name:'GitLab', cat:'vcs', tag:'Version Control', desc:'Git hosting with CI/CD, issue tracking, and registries in one platform.', cmd:'$ glab mr create' },
    { name:'Vault', cat:'iac', tag:'IaC', desc:'Stores and rotates secrets so credentials never sit in plaintext config.', cmd:'$ vault kv get secret/db' }
  ];

  const grid = document.getElementById('toolsGrid');
  const noResults = document.getElementById('noResults');
  const resultCount = document.getElementById('resultCount');
  const searchInput = document.getElementById('searchInput');
  const filterBtns = document.querySelectorAll('.filter-btn');

  let activeFilter = 'all';
  let searchTerm = '';

  const tagClass = { cicd:'tag-cicd', container:'tag-container', iac:'tag-iac', monitor:'tag-monitor', vcs:'tag-vcs' };

  function render(){
    const filtered = TOOLS.filter(t => {
      const matchesFilter = activeFilter === 'all' || t.cat === activeFilter;
      const matchesSearch = t.name.toLowerCase().includes(searchTerm) || t.desc.toLowerCase().includes(searchTerm);
      return matchesFilter && matchesSearch;
    });

    grid.innerHTML = filtered.map(t => `
      <div class="tool-card">
        <div class="tool-top">
          <span class="tool-name">${t.name}</span>
          <span class="tool-tag ${tagClass[t.cat]}">${t.tag}</span>
        </div>
        <p class="tool-desc">${t.desc}</p>
        <div class="tool-cmd">${t.cmd.replace('$', '<span class="p">$</span>')}</div>
      </div>
    `).join('');

    noResults.classList.toggle('show', filtered.length === 0);
    resultCount.textContent = `$ showing ${filtered.length} of ${TOOLS.length} tools`;
  }

  filterBtns.forEach(btn => {
    btn.addEventListener('click', () => {
      filterBtns.forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      activeFilter = btn.dataset.filter;
      render();
    });
  });

  searchInput.addEventListener('input', (e) => {
    searchTerm = e.target.value.toLowerCase().trim();
    render();
  });

  render();
</script>

</body>
</html>
