<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Your Dashboard</title>
    <style>
        :root {
            --primary-color: #4F46E5;
            --bg-color: #F3F4F6;
            --card-bg: #FFFFFF;
            --text-main: #1F2937;
            --text-muted: #6B7280;
            --border-color: #E5E7EB;
        }

        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 2rem;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            background: var(--card-bg);
            max-width: 500px;
            width: 100%;
            padding: 2.5rem;
            border-radius: 12px;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
        }

        h1 {
            margin-top: 0;
            font-size: 1.875rem;
            color: var(--text-main);
            margin-bottom: 0.25rem;
        }

        .greeting-day {
            color: var(--primary-color);
            font-weight: 600;
            margin-top: 0;
            margin-bottom: 2rem;
            font-size: 1.125rem;
        }

        h2 {
            font-size: 1.25rem;
            border-bottom: 2px solid var(--border-color);
            padding-bottom: 0.5rem;
            margin-bottom: 1.25rem;
        }

        ul {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        li {
            background: #F9FAFB;
            margin-bottom: 0.75rem;
            padding: 1rem 1.25rem;
            border-radius: 8px;
            border-left: 4px solid var(--primary-color);
            font-weight: 500;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        li:hover {
            transform: translateX(4px);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        .empty-state {
            color: var(--text-muted);
            font-style: italic;
            text-align: center;
            padding: 2rem 1rem;
            background: #F9FAFB;
            border-radius: 8px;
            border: 1px dashed var(--border-color);
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Welcome, {{ name }}!</h1>
        {# Using the 'name' variable #}

        <p class="greeting-day">Happy {{ day }}!</p>
        {# Using the 'day' variable #}

        <h2>Your Tasks for Today</h2>
        
        {% if tasks %}
            <ul>
                {% for task in tasks %}
                    <li>{{ task }}</li>
                {% endfor %}
            </ul>
        {% else %}
            <p class="empty-state">No tasks for today. Enjoy your downtime!</p>
        {% endif %}
    </div>

</body>
</html>
