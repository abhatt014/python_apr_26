services:
  mysqldb:
    image: mysql:8.0
    networks:
      - ecomm_app
    container_name: mysqldb
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: ecom_mono
      MYSQL_USER: appuser
      MYSQL_PASSWORD: apppassword
    volumes:
      - db_data:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
  mono_app:
    build:
      context: ./
      dockerfile: Dockerfile
    image: amitfreeze/april_mono:latest 
    networks:
      - ecomm_app
    container_name: mono_app
    restart: always
    ports:
      - 5001:5001
    environment: 
      MYSQL_HOST: mysqldb
      MYSQL_DATABASE: ecom_mono
      MYSQL_USER: appuser
      MYSQL_PASSWORD: apppassword
volumes:
  db_data:
networks:
  ecomm_app:
    driver: bridge  