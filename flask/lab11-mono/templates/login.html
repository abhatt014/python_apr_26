{% extends 'base.html' %} 
{% block content %}
    <!--loginpage-->
    <body class="auth-body">
  <button class="icon-button theme-toggle auth-theme-toggle" type="button" data-theme-toggle aria-label="Switch color theme" title="Switch color theme">
    <i class="bi bi-moon-stars" data-theme-icon aria-hidden="true"></i>
  </button>
  <main class="auth-page">
    <section class="auth-card">
      <a class="auth-brand" href="index.html"><span class="brand-icon"><i class="bi bi-grid-1x2-fill"
            aria-hidden="true"></i></span><span><strong>E-Commerce App</strong></span></a>

      <form action="/login" method="post" class="needs-validation" novalidate>
          <div class="mb-4">
          <h1 class="h3 mb-1">Login</h1>
          
        </div>
        <div class="mb-3"><label class="form-label" for="loginEmail">Email address</label>
          <input class="form-control" id="loginEmail" type="email" name="email" required>
          <div class="invalid-feedback">Enter a valid email.</div>
        </div>
        <div class="mb-3">
          <div class="d-flex justify-content-between">
            <label class="form-label" for="loginPassword">Password</label>
            </div>
            <input class="form-control" id="loginPassword" type="password" name="password"  required>
          <div class="invalid-feedback">Password must be at least 6 characters.</div>
        </div>
               <button class="btn btn-primary w-100" type="submit"><i class="bi bi-box-arrow-in-right" aria-hidden="true"></i>
          Sign In</button>
      </form>

      <div class="auth-footer">New here? <a href="/register">Create an account</a></div>
    </section>
      </main>
{% endblock %}
