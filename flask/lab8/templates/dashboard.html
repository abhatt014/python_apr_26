<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flask App</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; }
        .card { border-radius: 1rem; }
    </style>
</head>
<body>
    <!-- Navigation Bar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4 shadow-sm">
        <div class="container">
            <a class="navbar-brand" href="#">MyApp</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <!-- Update hrefs to match your Flask routes (e.g., url_for('login')) -->
                    <li class="nav-item"><a class="nav-link" href="/login">Login</a></li>
                    <li class="nav-item"><a class="nav-link" href="/register">Register</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Main Content Area -->
    <div class="container">

<!-- Dashboard Header -->
<div class="row mb-4 mt-3">
    <div class="col">
        <div class="d-flex justify-content-between align-items-center">
            <h2>Dashboard</h2>
            <a href="/logout" class="btn btn-outline-danger btn-sm">Logout</a>
        </div>
        <!-- You can pass the user's name from your Flask route into this variable -->
        <p class="text-muted">Welcome back, {{ user_name | default('User') }}!</p>
    </div>
</div>

<!-- Dashboard Widgets -->
<div class="row">
    <div class="col-md-4 mb-4">
        <div class="card text-bg-primary shadow-sm h-100 border-0">
            <div class="card-body">
                <h6 class="card-title text-uppercase mb-2 text-white-50">Profile Status</h6>
                <h2 class="card-text mb-0">Active</h2>
            </div>
        </div>
    </div>
    <div class="col-md-4 mb-4">
        <div class="card text-bg-success shadow-sm h-100 border-0">
            <div class="card-body">
                <h6 class="card-title text-uppercase mb-2 text-white-50">Systems Online</h6>
                <h2 class="card-text mb-0">3 / 3</h2>
            </div>
        </div>
    </div>
    <div class="col-md-4 mb-4">
        <div class="card text-bg-dark shadow-sm h-100 border-0">
            <div class="card-body">
                <h6 class="card-title text-uppercase mb-2 text-white-50">Notifications</h6>
                <h2 class="card-text mb-0">5 New</h2>
            </div>
        </div>
    </div>
</div>

    </div>

    <!-- Bootstrap 5 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
